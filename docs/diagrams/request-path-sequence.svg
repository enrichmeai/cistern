<text x="217.5" y="491" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#a3401f">denied + authenticated → 403</text>
<text x="217.5" y="507" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#a3401f">(no decision is cached: revocation lands on the next request)</text>
<rect x="40" y="542" width="1175" height="26" fill="#e0eee2" rx="4"/>
<text x="52" y="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#2f6b3d">ALLOWED → THE HANDLER RUNS</text>
