<text x="205.0" y="509" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#a3401f">denied + authenticated → 403</text>
<text x="205.0" y="525" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#a3401f">(no decision is cached: revocation lands on the next request)</text>
