<text x="707" y="403" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">WacEngine: evaluate Authorization triples · deny by default</text>
<line x1="655" y1="436" x2="305" y2="436" stroke="#6f8083" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-ret)"/>
<text x="480.0" y="429" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#6f8083">allow / deny (+ the deciding ACL resource)</text>
