<text x="52" y="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="0.06em" fill="#2f6b3d">ALLOWED → THE HANDLER RUNS</text>
