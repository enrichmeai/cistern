<text x="830.0" y="313" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">read &lt;target&gt;.acl, else walk up to nearest acl:default</text>
