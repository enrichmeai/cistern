<text x="320" y="75" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="650" fill="#17262a">Cistern</text>
<text x="320" y="90" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#6f8083">gatekeeper + store</text>
<line x1="510" y1="96" x2="510" y2="847" stroke="#c9d3d0" stroke-width="1.2"/>
<rect x="430" y="56" width="160" height="40" rx="6" fill="#ffffff" stroke="#c9d3d0" stroke-width="1.2"/>
<text x="510" y="75" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="650" fill="#17262a">Agent</text>
<text x="510" y="90" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#6f8083">no credential</text>
<rect x="40" y="104" width="560" height="26" fill="#eaf0ee" rx="4"/>
<text x="52" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#435457">1 · OWNER STORES AN ITINERARY AND A PASSPORT</text>
<line x1="130" y1="149" x2="320" y2="149" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="225.0" y="142" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#435457">PUT /trips/bali-sep</text>
<line x1="320" y1="176" x2="130" y2="176" stroke="#2f6b3d" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-ok)"/>
