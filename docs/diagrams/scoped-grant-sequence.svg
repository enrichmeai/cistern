<text x="225.0" y="672" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#435457">DELETE /trips/.acl</text>
<line x1="320" y1="706" x2="130" y2="706" stroke="#2f6b3d" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-ok)"/>
<text x="225.0" y="699" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#2f6b3d" font-weight="600">204 No Content</text>
<line x1="510" y1="733" x2="320" y2="733" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="415.0" y="726" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#435457">GET /trips/bali-sep  (the very next request)</text>
