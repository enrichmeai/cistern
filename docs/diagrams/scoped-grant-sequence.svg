<text x="415.0" y="330" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6f8083">WWW-Authenticate: Bearer realm=&quot;cistern&quot;</text>
<rect x="40" y="342" width="560" height="26" fill="#eaf0ee" rx="4"/>
