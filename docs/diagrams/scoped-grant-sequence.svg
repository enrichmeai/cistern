<rect x="40" y="243" width="560" height="26" fill="#f6e4dc" rx="4"/>
<text x="52" y="261" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#a3401f">2 · AGENT ASKS WITH NO GRANT</text>
