<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1054" width="640" height="1054" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<defs><marker id="arr-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#435457"/></marker><marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b3d"/></marker><marker id="arr-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3401f"/></marker><marker id="arr-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8083"/></marker></defs>
<rect width="640" height="1054" fill="#ffffff"/>
<text x="40" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#6f8083">SEQUENCE · THE SCOPED‑GRANT DEMO (RUNS TODAY)</text>
<line x1="130" y1="114" x2="130" y2="1040" stroke="#c9d3d0" stroke-width="1.2"/>
<rect x="50" y="70" width="160" height="44" rx="6" fill="#ffffff" stroke="#c9d3d0" stroke-width="1.2"/>
<text x="130" y="89" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#17262a">Owner</text>
<text x="130" y="104" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#6f8083">holds the credential</text>
<line x1="320" y1="114" x2="320" y2="1040" stroke="#c9d3d0" stroke-width="1.2"/>
<rect x="240" y="70" width="160" height="44" rx="6" fill="#ffffff" stroke="#c9d3d0" stroke-width="1.2"/>
<text x="320" y="89" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#17262a">Cistern</text>
<text x="320" y="104" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#6f8083">gatekeeper + store</text>
<line x1="510" y1="114" x2="510" y2="1040" stroke="#c9d3d0" stroke-width="1.2"/>
<rect x="430" y="70" width="160" height="44" rx="6" fill="#ffffff" stroke="#c9d3d0" stroke-width="1.2"/>
<text x="510" y="89" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#17262a">Agent</text>
<text x="510" y="104" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#6f8083">no credential</text>
<rect x="40" y="122" width="560" height="26" fill="#eaf0ee" rx="4"/>
<text x="52" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#435457">1 · OWNER STORES AN ITINERARY AND A PASSPORT</text>
<line x1="130" y1="174" x2="320" y2="174" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="225.0" y="167" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">PUT /trips/bali-sep</text>
<line x1="320" y1="208" x2="130" y2="208" stroke="#2f6b3d" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-ok)"/>
<text x="225.0" y="201" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#2f6b3d" font-weight="600">201 Created</text>
<line x1="130" y1="242" x2="320" y2="242" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="225.0" y="235" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">PUT /identity/passport</text>
<line x1="320" y1="276" x2="130" y2="276" stroke="#2f6b3d" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-ok)"/>
<text x="225.0" y="269" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#2f6b3d" font-weight="600">201 Created</text>
<rect x="40" y="296" width="560" height="26" fill="#f6e4dc" rx="4"/>
<text x="52" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#a3401f">2 · AGENT ASKS WITH NO GRANT</text>
<line x1="510" y1="348" x2="320" y2="348" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="415.0" y="341" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">GET /trips/bali-sep</text>
<line x1="320" y1="382" x2="510" y2="382" stroke="#a3401f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-deny)"/>
<text x="415.0" y="375" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#a3401f" font-weight="600">401 — no rule permits it</text>
<text x="415.0" y="397" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6f8083">WWW-Authenticate: Bearer realm=&quot;cistern&quot;</text>
<rect x="40" y="416" width="560" height="26" fill="#eaf0ee" rx="4"/>
<text x="52" y="434" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#435457">3 · OWNER WRITES THE RULE — A FILE IN THE POD</text>
<line x1="130" y1="468" x2="320" y2="468" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="225.0" y="461" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">PUT /trips/.acl  (anyone may Read /trips/)</text>
<line x1="320" y1="502" x2="130" y2="502" stroke="#2f6b3d" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-ok)"/>
<text x="225.0" y="495" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#2f6b3d" font-weight="600">201 Created</text>
<rect x="40" y="522" width="560" height="26" fill="#eaf0ee" rx="4"/>
<text x="52" y="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#435457">4 · AGENT TRIES AGAIN — INSIDE AND OUTSIDE THE GRANT</text>
<line x1="510" y1="574" x2="320" y2="574" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="415.0" y="567" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">GET /trips/bali-sep</text>
<line x1="320" y1="608" x2="510" y2="608" stroke="#2f6b3d" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-ok)"/>
<text x="415.0" y="601" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#2f6b3d" font-weight="600">200 OK</text>
<text x="415.0" y="623" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6f8083">WAC-Allow: user=&quot;read&quot;,public=&quot;read&quot;</text>
<line x1="510" y1="656" x2="320" y2="656" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="415.0" y="649" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">DELETE /trips/bali-sep</text>
<line x1="320" y1="690" x2="510" y2="690" stroke="#a3401f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-deny)"/>
<text x="415.0" y="683" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#a3401f" font-weight="600">401 — read is not write</text>
<line x1="510" y1="724" x2="320" y2="724" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="415.0" y="717" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">GET /identity/passport</text>
<line x1="320" y1="758" x2="510" y2="758" stroke="#a3401f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-deny)"/>
<text x="415.0" y="751" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#a3401f" font-weight="600">401 — outside the grant</text>
<rect x="40" y="778" width="560" height="26" fill="#f6e4dc" rx="4"/>
<text x="52" y="796" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#a3401f">5 · OWNER REVOKES — DELETE THE RULE; NO RESTART, NO TOKEN REISSUED</text>
<line x1="130" y1="830" x2="320" y2="830" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="225.0" y="823" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">DELETE /trips/.acl</text>
<line x1="320" y1="864" x2="130" y2="864" stroke="#2f6b3d" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-ok)"/>
<text x="225.0" y="857" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#2f6b3d" font-weight="600">204 No Content</text>
<line x1="510" y1="898" x2="320" y2="898" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="415.0" y="891" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">GET /trips/bali-sep  (the very next request)</text>
<line x1="320" y1="932" x2="510" y2="932" stroke="#a3401f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-deny)"/>
<text x="415.0" y="925" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#a3401f" font-weight="600">401 — refused again</text>
<line x1="130" y1="966" x2="320" y2="966" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="225.0" y="959" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#435457">GET /trips/bali-sep</text>
<line x1="320" y1="1000" x2="130" y2="1000" stroke="#2f6b3d" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-ok)"/>
<text x="225.0" y="993" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#2f6b3d" font-weight="600">200 OK — owner unaffected</text>
</svg>