<line x1="510" y1="472" x2="320" y2="472" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="415.0" y="465" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#435457">GET /trips/bali-sep</text>
<line x1="320" y1="499" x2="510" y2="499" stroke="#2f6b3d" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-ok)"/>
<text x="415.0" y="492" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#2f6b3d" font-weight="600">200 OK</text>
<text x="415.0" y="514" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6f8083">WAC-Allow: user=&quot;read&quot;,public=&quot;read&quot;</text>
<line x1="510" y1="540" x2="320" y2="540" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="415.0" y="533" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#435457">DELETE /trips/bali-sep</text>
<line x1="320" y1="567" x2="510" y2="567" stroke="#a3401f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-deny)"/>
<text x="415.0" y="560" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#a3401f" font-weight="600">401 — read is not write</text>
<line x1="510" y1="594" x2="320" y2="594" stroke="#435457" stroke-width="1.6" marker-end="url(#arr-req)"/>
<text x="415.0" y="587" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#435457">GET /identity/passport</text>
<line x1="320" y1="621" x2="510" y2="621" stroke="#a3401f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-deny)"/>
