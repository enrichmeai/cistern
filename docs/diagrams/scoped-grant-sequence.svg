<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 861" width="640" height="861" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<defs><marker id="arr-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#435457"/></marker><marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b3d"/></marker><marker id="arr-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3401f"/></marker><marker id="arr-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f8083"/></marker></defs>
<rect width="640" height="861" fill="#ffffff"/>
<text x="40" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#6f8083">SEQUENCE · THE SCOPED‑GRANT DEMO (RUNS TODAY)</text>
<line x1="130" y1="96" x2="130" y2="847" stroke="#c9d3d0" stroke-width="1.2"/>
