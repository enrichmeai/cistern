# Cistern, one command:  docker compose up --build
#
# Runs on http://127.0.0.1:3737 by default. Port 3000 is crowded on a dev machine —
# something else holding it does not fail loudly, it just answers your requests instead,
# which reads as Cistern misbehaving. Pick your own when several instances run at once:
#
#   CISTERN_HOST_PORT=3801 docker compose up
#
# SECURITY: authentication and Web Access Control are built and are enforced the moment
# an owner is configured (CISTERN_OWNER_WEBID turns enforcement on — see the README
# quickstart). This file deliberately configures no owner, so a bare `docker compose up`
# runs with enforcement OFF (the server warns NO_OWNER_CONFIGURED at boot) — fine for
# hacking on the server, wrong for holding anything. That is why the port is bound to
# 127.0.0.1: local/private-network only, per ADR 0002's development shape
# (docs/adr/0002-production-posture.md). Facing a network takes an owner; facing the
# internet takes the full production posture — TLS in front, no owner token, and the
# rest of ADR 0002's eight conditions (k8s/overlays/production or infra/terraform).

services:
  cistern:
    build: .
    image: cistern:local
    # Loopback only: with no owner configured here, nothing would stop a stranger
    # emptying the pod on 0.0.0.0 — and even enforcing, an internet-facing instance
    # belongs behind the ADR 0002 posture, not on a raw published port. Only the HOST
    # side varies — inside the container it is always 3000, where nothing can collide
    # with it.
    ports:
      - "127.0.0.1:${CISTERN_HOST_PORT:-3737}:3000"
    environment:
      CISTERN_STORAGE_ROOT: /data
      # Derived from the same variable on purpose. cistern.base-url mints Location
      # headers and the storage description, so if it and the published port ever
      # disagree the pod hands out URIs nobody can reach — a bug that surfaces far from
      # its cause. One knob means they cannot drift.
      CISTERN_BASE_URL: http://localhost:${CISTERN_HOST_PORT:-3737}
    volumes:
      # A named volume, so /data keeps the image's ownership. A bind mount would
      # carry the host's instead, and the non-root user could not write to it.
      - cistern-data:/data
    restart: unless-stopped

volumes:
  cistern-data:
