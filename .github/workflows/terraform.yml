name: terraform

# Two paths, deliberately separated:
#
#   validate — runs on every PR touching infra, needs NO cloud credentials at all
#              (`init -backend=false` installs providers without touching the state
#              bucket). A contributor with no GCP access still gets a useful check.
#   plan/apply — manual only, needs Workload Identity Federation, and apply carries
#              an explicit typed confirmation. See ADR 0002: an apply puts a pod on
#              the internet, and its conditions (TLS in front, enforcement on, no
#              owner token, backups drilled) are the operator's to have met first.

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'plan or apply'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply]
      confirm:
        description: "For apply only: type 'adr-0002-conditions-met' to confirm the ADR 0002 conditions hold (TLS in front, cistern.owner.web-id set, no owner token, per-tenant isolation, backups drilled)."
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/terraform

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Format
        run: terraform fmt -check -recursive -diff

      # -backend=false: no state bucket, no credentials, no chicken-and-egg.
      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  # Plan is read-only, so it is NOT behind the environment gate — otherwise seeing
  # what would change requires an approval, and the gate stops meaning anything.
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # required for keyless auth to GCP
    steps:
      - uses: actions/checkout@v4

      - name: Check WIF and the domain are configured
        run: |
          if [ -z "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT / GCP_TF_STATE_BUCKET are not set. See infra/terraform/README.md for the one-time bootstrap."
            exit 1
          fi
          if [ -z "${{ vars.CISTERN_DOMAIN }}" ]; then
            echo "::error::CISTERN_DOMAIN is not set: the public hostname the managed certificate is issued for and cistern.base-url is built from."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}" -backend-config="prefix=test-pod"

      - name: Plan
        run: terraform plan -input=false -var "project_id=${{ vars.GCP_PROJECT_ID }}" -var "domain=${{ vars.CISTERN_DOMAIN }}" -out=tfplan

      - name: Keep the plan for apply
        if: inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 1

  # Apply is gated three ways: the typed phrase, the protected environment (required
  # reviewer), and applying the exact plan produced above rather than re-planning.
  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: test-pod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # ADR 0002: an apply puts a pod on the internet. Manual dispatch alone is one
      # mis-click; this makes the operator state that the conditions are met.
      - name: Confirm intent
        run: |
          if [ "${{ inputs.confirm }}" != "adr-0002-conditions-met" ]; then
            echo "::error::apply requires the confirmation phrase — see docs/adr/0002-production-posture.md. Refusing."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}" -backend-config="prefix=test-pod"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/terraform

      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan
