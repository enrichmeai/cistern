name: k8s

# Renders and validates both overlays against real Kubernetes API schemas, then holds each
# to its posture. Needs no cluster and no credentials, so it runs on every PR — the point
# is that a broken manifest, or a manifest that quietly loosens a posture, fails review
# rather than failing in someone's terminal.

on:
  pull_request:
    paths:
      - 'k8s/**'
      - '.github/workflows/k8s.yml'
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/k8s.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform

      - name: Render both overlays
        run: |
          kubectl kustomize k8s/overlays/local      | tee /tmp/local.yaml
          kubectl kustomize k8s/overlays/production | tee /tmp/production.yaml

      # Schema validation without a cluster. -strict rejects unknown fields, which is what
      # catches a typo'd key the API would otherwise silently ignore.
      - name: Validate against Kubernetes schemas
        run: |
          /tmp/kubeconform -strict -summary -output text /tmp/local.yaml
          /tmp/kubeconform -strict -summary -output text /tmp/production.yaml

      # Both overlays: the Service stays ClusterIP. Locally it is what keeps the pod
      # unreachable (ADR 0001 posture, kept for development); in production the Ingress
      # terminates TLS in front of it and exposing the plain-HTTP port would bypass that
      # (ADR 0002). And the image is a pinned tag: :latest moves, a rollback would be a guess.
      - name: Both overlays — ClusterIP only, pinned image
        run: |
          for f in /tmp/local.yaml /tmp/production.yaml; do
            if grep -nE '^\s*type:\s*(NodePort|LoadBalancer)' "$f"; then
              echo "::error::$f: Service must stay ClusterIP — see k8s/README.md."
              exit 1
            fi
            if grep -nE '^\s*image:' "$f" | grep -vE ':[A-Za-z0-9._-]+$'; then
              echo "::error::$f: image must carry a pinned tag."
              exit 1
            fi
            if grep -nE '^\s*image:.*:latest$' "$f"; then
              echo "::error::$f: image must not be :latest."
              exit 1
            fi
          done
          echo "Service is ClusterIP and the image is pinned in both overlays."

      # The local overlay is the development posture: no Ingress, no TLS, port-forward only.
      - name: Local overlay — no Ingress
        run: |
          if grep -qiE '^\s*kind:\s*Ingress' /tmp/local.yaml; then
            echo "::error::k8s/overlays/local must not contain an Ingress — it is reached by port-forward only (k8s/README.md)."
            exit 1
          fi
          echo "Local overlay has no Ingress."

      # The production overlay is ADR 0002's posture: an Ingress WITH TLS, a NetworkPolicy,
      # IfNotPresent on the pinned tag, one replica, and no owner token anywhere.
      - name: Production overlay — Ingress with TLS, NetworkPolicy, no owner token
        run: |
          if ! grep -qiE '^\s*kind:\s*Ingress' /tmp/production.yaml; then
            echo "::error::k8s/overlays/production must contain an Ingress (ADR 0002 condition 1)."
            exit 1
          fi
          if ! grep -qE '^\s*tls:' /tmp/production.yaml; then
            echo "::error::the production Ingress must terminate TLS (spec.tls) — ADR 0002 condition 1."
            exit 1
          fi
          if ! grep -qiE '^\s*kind:\s*NetworkPolicy' /tmp/production.yaml; then
            echo "::error::k8s/overlays/production must carry a NetworkPolicy admitting only the ingress controller."
            exit 1
          fi
          if ! grep -qE '^\s*imagePullPolicy:\s*IfNotPresent' /tmp/production.yaml; then
            echo "::error::production must pull the pinned tag with IfNotPresent."
            exit 1
          fi
          if ! grep -qE '^\s*replicas:\s*1$' /tmp/production.yaml; then
            echo "::error::the file backend is single-writer: production stays at one replica."
            exit 1
          fi
          if grep -n 'CISTERN_OWNER_TOKEN' /tmp/production.yaml; then
            echo "::error::the production overlay must not reference CISTERN_OWNER_TOKEN (ADR 0002 condition 3)."
            exit 1
          fi
          echo "Production overlay: Ingress with TLS, NetworkPolicy, IfNotPresent, one replica, no owner token."
