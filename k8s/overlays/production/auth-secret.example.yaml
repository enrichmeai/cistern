# The authentication environment for the production overlay: who owns the pod, which OIDC
# issuer is trusted, which applications may authenticate as themselves. Keys are
# environment-variable names (the Deployment mounts it with envFrom), so Boot's relaxed
# binding maps CISTERN_OWNER_WEBID to cistern.owner.web-id and
# CISTERN_AUTH_SERVICEPRINCIPALS_0_CREDENTIALHASH to cistern.auth.service-principals[0].credential-hash.
#
# Copy, change the values, apply, never commit the result:
#
#   cp k8s/overlays/production/auth-secret.example.yaml /tmp/cistern-auth.yaml
#   # edit it
#   kubectl apply -f /tmp/cistern-auth.yaml
#
# Or from an env file, which keeps it out of YAML entirely:
#
#   kubectl create secret generic cistern-auth -n cistern --from-env-file=cistern.env
#
# Rotate anything by replacing the Secret and restarting the Deployment
# (`kubectl rollout restart -n cistern deploy/cistern`); nothing is cached across a boot.
#
# There is NO CISTERN_OWNER_TOKEN here, deliberately (ADR 0002 condition 3): the local
# bearer token is plaintext at rest and belongs on a private network only. The owner
# authenticates through the issuer (a JWT whose `webid` claim is the owner's WebID) or,
# until the IdP is wired, with a hashed service credential carrying the owner's WebID.
#
# The server enforces the pairing: an issuer or service principals WITHOUT
# CISTERN_OWNER_WEBID is a start-up refusal (ENFORCEMENT_REQUIRES_OWNER) — enforcement is
# keyed on the owner, and credentials nobody is asked for would leave the pod open while
# its configuration read as locked. `kubectl logs -n cistern deploy/cistern` shows the banner.
apiVersion: v1
kind: Secret
metadata:
  name: cistern-auth
  namespace: cistern
type: Opaque
stringData:
  # The pod owner. Setting this turns Web Access Control ON and seeds the root ACL for it.
  CISTERN_OWNER_WEBID: "https://valuedocs.co.in/profile#admin"

  # Humans (and, if you prefer OAuth client credentials to shared secrets, applications)
  # through your identity provider. `iss` must equal the issuer verbatim; `aud` must name
  # one of the audiences; the WebID is the `webid` claim (or set CISTERN_AUTH_OIDC_WEBID_TEMPLATE).
  CISTERN_AUTH_OIDC_ISSUER: "https://id.valuedocs.co.in/realms/valuedocs"
  CISTERN_AUTH_OIDC_AUDIENCES: "cistern"
  CISTERN_AUTH_OIDC_WEBID_CLAIM: "webid"

  # Each application as itself: its own WebID, its own secret configured HASHED.
  #   printf '%s' "$SECRET" | shasum -a 256 | cut -d' ' -f1 | sed 's/^/sha256:/'
  # The application presents the plain secret; nothing at rest can be presented.
  CISTERN_AUTH_SERVICEPRINCIPALS_0_WEBID: "https://valuedocs.co.in/apps/legal#id"
  CISTERN_AUTH_SERVICEPRINCIPALS_0_CREDENTIALHASH: "sha256:change-me-64-hex-characters"
  CISTERN_AUTH_SERVICEPRINCIPALS_1_WEBID: "https://valuedocs.co.in/apps/tax#id"
  CISTERN_AUTH_SERVICEPRINCIPALS_1_CREDENTIALHASH: "sha256:change-me-64-hex-characters"

  # Optional: further pods, each with its own owner, provisioned idempotently at boot (T5.6).
  # CISTERN_PODS_SEED_0_ROOT: "/firms/acme/"
  # CISTERN_PODS_SEED_0_OWNERWEBID: "https://acme-law.example/profile#firm"
