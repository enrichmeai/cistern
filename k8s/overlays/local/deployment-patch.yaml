# What the local overlay adds to the base Deployment: the base URL of the port-forward,
# and the owner's identity plus local bearer token from the `cistern-owner` Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cistern
  namespace: cistern
spec:
  template:
    spec:
      containers:
        - name: cistern
          env:
            # Must be the URL clients actually call, which with `kubectl port-forward`
            # is the LOCAL side of the forward — 3737 by default here, matching
            # docker-compose. Forwarding to a different local port? Change this to match.
            - name: CISTERN_BASE_URL
              value: http://localhost:3737
            # Who owns this pod. Setting these two turns Web Access Control ON: the root
            # ACL is seeded granting this WebID full access, and everything else — every
            # anonymous request included — is denied by default. The token is a shared
            # bearer secret for a private network; it is what makes this overlay LOCAL.
            # Without the Secret the pod will not start, deliberately: silently running
            # with no authorization layer because a secret was missing is the failure
            # this prevents.
            - name: CISTERN_OWNER_WEBID
              valueFrom:
                secretKeyRef: {name: cistern-owner, key: web-id}
            - name: CISTERN_OWNER_TOKEN
              valueFrom:
                secretKeyRef: {name: cistern-owner, key: token}
