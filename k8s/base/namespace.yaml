apiVersion: v1
kind: Namespace
metadata:
  name: cistern
  labels:
    app.kubernetes.io/name: cistern
    # The restricted Pod Security Standard, enforced: a pod that is not non-root, with
    # a read-only root filesystem and all capabilities dropped, is refused outright.
    # Verified enforced on Docker Desktop (k8s/README.md).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
