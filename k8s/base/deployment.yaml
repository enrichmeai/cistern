apiVersion: apps/v1
kind: Deployment
metadata:
  name: cistern
  namespace: cistern
  labels:
    app.kubernetes.io/name: cistern
spec:
  # One writer, always. The file backend has no distributed locking, so two pods sharing
  # the volume would interleave writes to the same resources.
  replicas: 1

  # Recreate, NOT the default RollingUpdate. A rolling update starts the new pod before
  # terminating the old one, which against a ReadWriteOnce volume either wedges the
  # rollout on a multi-node cluster or — worse, on a single node — briefly runs two
  # writers over the same data directory.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: cistern
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cistern
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # fsGroup is what makes the mounted volume group-writable by the container user.
        # Without it the PVC arrives root-owned and the non-root process cannot write —
        # the pod starts, then fails on the first PUT.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cistern
          # The published release image, pinned to a version — never `latest`, which moves.
          # For a local build instead (`docker build -t cistern:local .`), use
          #   image: cistern:local
          #   imagePullPolicy: Never      # the tag exists in no registry; never try to pull it
          # or, without editing this file:  kustomize edit set image ghcr.io/enrichmeai/cistern=cistern:local
          # (see kustomization.yaml). On minikube also `minikube image load cistern:local`.
          image: ghcr.io/enrichmeai/cistern:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CISTERN_STORAGE_ROOT
              value: /data
            # Respect the container memory limit instead of the host's RAM.
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0"
            # Two things every overlay MUST add, because they differ by deployment and
            # the base would be wrong for one of them:
            #   CISTERN_BASE_URL — the URL clients actually call. It mints Location headers
            #     and the storage description, so a mismatch makes the pod hand out
            #     unreachable URIs. Local: the port-forward's local side; production: the
            #     Ingress host, https.
            #   who owns the pod — CISTERN_OWNER_WEBID (this is what turns Web Access
            #     Control ON and seeds the root ACL) plus how the owner authenticates: the
            #     local overlay adds CISTERN_OWNER_TOKEN from a Secret; the production
            #     overlay adds the OIDC issuer / service credentials from a Secret and no
            #     token at all (ADR 0002). Left unset, the pod has no authorization layer,
            #     which the server warns about on boot; credentials configured without the
            #     owner are refused at start-up.
          volumeMounts:
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem is on, and the JVM still needs somewhere to write
            # (hsperfdata, any java.io.tmpdir use). Without this the container fails at
            # startup rather than at first request.
            - name: tmp
              mountPath: /tmp

          # All three probes are TCP, deliberately. The storage root legitimately 404s
          # until pods are provisioned (T5.4), so an httpGet probe would treat a healthy
          # server as failed and crash-loop it.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
            failureThreshold: 30   # ~90s for the JVM to come up
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
              # No CPU limit on purpose: a limit throttles JVM startup and buys nothing
              # on a single-tenant cluster. The production overlay raises the memory
              # figures; the reasoning is the same.

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cistern-data
        - name: tmp
          emptyDir: {}
